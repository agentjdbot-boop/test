name: Build R D Techno Compatibility APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q build-source.zip -d buildsrc

      - name: Apply broad Android compatibility settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/rd-techno-factory-app/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = 26", "minSdk = 21")
          s = s.replace("versionCode = 1", "versionCode = 2")
          s = s.replace('versionName = "0.1.0-test"', 'versionName = "0.1.1-compat"')
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s.replace(
                  "targetCompatibility = JavaVersion.VERSION_17\n    }",
                  "targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }"
              )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.2")' not in s:
              s = s.replace(
                  "dependencies {\n",
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.2")\n'
              )
          p.write_text(s)
          PY

      - name: Build unsigned universal release APK
        working-directory: buildsrc/rd-techno-factory-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore persistent test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.rdtechno-signing
          key: rd-techno-test-signing-v1

      - name: Create persistent test release signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.rdtechno-signing"
          keytool -genkeypair -v             -keystore "$HOME/.rdtechno-signing/rd-techno-test.jks"             -storepass rdtechno2026             -keypass rdtechno2026             -alias rdtechno             -keyalg RSA -keysize 4096 -validity 3650             -dname "CN=R D Techno Internal Test, OU=Factory Tools, O=R D Techno, L=Punjab, C=IN"

      - name: Zipalign and sign APK
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="buildsrc/rd-techno-factory-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/rd-techno-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign             --ks "$HOME/.rdtechno-signing/rd-techno-test.jks"             --ks-pass pass:rdtechno2026             --key-pass pass:rdtechno2026             --ks-key-alias rdtechno             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out rd-techno-v0.1.1-compat-universal.apk             "$RUNNER_TEMP/rd-techno-aligned.apk"

      - name: Verify APK compatibility and signatures
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs rd-techno-v0.1.1-compat-universal.apk | tee apk-signature-report.txt
          "$BUILD_TOOLS/aapt" dump badging rd-techno-v0.1.1-compat-universal.apk | tee apk-badging-report.txt
          grep -q "sdkVersion:'21'" apk-badging-report.txt
          grep -q "targetSdkVersion:'35'" apk-badging-report.txt
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86' 'x86_64'" apk-badging-report.txt

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: rd-techno-v0.1.1-compat-universal
          path: |
            rd-techno-v0.1.1-compat-universal.apk
            apk-signature-report.txt
            apk-badging-report.txt
          if-no-files-found: error
