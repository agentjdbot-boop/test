name: Build R D Techno APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q build-source.zip -d buildsrc
      - name: Build debug APK
        working-directory: buildsrc/rd-techno-factory-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        if: success()
        run: cp buildsrc/rd-techno-factory-app/app/build/outputs/apk/debug/app-debug.apk rd-techno-v0.1-test.apk
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rd-techno-v0.1-test
          path: rd-techno-v0.1-test.apk
          if-no-files-found: error
