name: Build R D Techno Final APK

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "final-overlay/**"
      - "build-source.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore persistent R D Techno test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rd-techno-android-test-signing-v2

      - name: Extract base source
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q build-source.zip -d buildsrc
          test -f buildsrc/rd-techno-factory-app/settings.gradle.kts

      - name: Apply final production UI overlay
        shell: bash
        run: |
          cat final-overlay/p00 final-overlay/p01 final-overlay/p02 final-overlay/p03 > "$RUNNER_TEMP/final-overlay.b64"
          test "$(wc -c < "$RUNNER_TEMP/final-overlay.b64")" -eq 31856
          base64 -d "$RUNNER_TEMP/final-overlay.b64" > "$RUNNER_TEMP/final-overlay.tgz"
          gzip -t "$RUNNER_TEMP/final-overlay.tgz"
          tar -tzf "$RUNNER_TEMP/final-overlay.tgz" >/dev/null
          tar -xzf "$RUNNER_TEMP/final-overlay.tgz" -C buildsrc/rd-techno-factory-app
          test -f buildsrc/rd-techno-factory-app/app/src/main/java/com/rdtechno/factory/ui/OutwardShareImage.kt
          test -f buildsrc/rd-techno-factory-app/app/src/main/java/com/rdtechno/factory/ui/OrderShareImage.kt
          test -f buildsrc/rd-techno-factory-app/app/src/main/res/xml/file_paths.xml
          grep -q 'versionName = "0.3.0-final"' buildsrc/rd-techno-factory-app/app/build.gradle.kts

      - name: Apply final order tracking viewmodel
        shell: bash
        run: |
          test "$(wc -c < final-overlay/vm)" -eq 5160
          base64 -d final-overlay/vm > "$RUNNER_TEMP/vm-overlay.tgz"
          gzip -t "$RUNNER_TEMP/vm-overlay.tgz"
          tar -xzf "$RUNNER_TEMP/vm-overlay.tgz" -C buildsrc/rd-techno-factory-app
          grep -q "data class OrderSummary" buildsrc/rd-techno-factory-app/app/src/main/java/com/rdtechno/factory/viewmodel/FactoryViewModel.kt

      - name: Build release APK
        working-directory: buildsrc/rd-techno-factory-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Create signing key if cache is empty
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=R D Techno Test, OU=Factory Tools, O=R D Techno, L=Punjab, C=IN"
          fi

      - name: Zipalign, sign and verify final APK
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$(find buildsrc/rd-techno-factory-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' | head -1)"
          test -n "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/rd-techno-final-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign             --ks "$HOME/.android/debug.keystore"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out rd-techno-v0.3.0-final.apk             "$RUNNER_TEMP/rd-techno-final-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs rd-techno-v0.3.0-final.apk | tee apk-signature-report.txt
          "$BUILD_TOOLS/aapt" dump badging rd-techno-v0.3.0-final.apk | tee apk-badging-report.txt
          grep -q "sdkVersion:'21'" apk-badging-report.txt
          grep -q "targetSdkVersion:'35'" apk-badging-report.txt
          grep -q "versionName='0.3.0-final'" apk-badging-report.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: rd-techno-v0.3.0-final
          path: |
            rd-techno-v0.3.0-final.apk
            apk-signature-report.txt
            apk-badging-report.txt
          if-no-files-found: error
